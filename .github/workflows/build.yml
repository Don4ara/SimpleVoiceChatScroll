name: Build SimpleVoiceChatScroll

on:
  push:
    branches:
      - main
      - "fabric/**"
      - "forge/**"
      - "neoforge/**"
      - "ver/**"
    tags:
      - "v*"
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read project metadata
        id: project
        shell: bash
        run: |
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          java="$(sed -n 's/^java_version=//p' gradle.properties)"
          test -n "$minecraft" && test -n "$version" && test -n "$java"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${version}-mc${minecraft}"
          fi
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Prepare release asset
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/release
          find build/libs -maxdepth 1 -type f -name 'SimpleVoiceChatScroll-*.jar' ! -name '*-sources.jar' -exec cp {} build/release/ \;

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.project.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SimpleVoiceChatScroll ${{ steps.project.outputs.version }} for Minecraft ${{ steps.project.outputs.minecraft }}
          files: build/release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: ${{ github.ref == 'refs/heads/main' }}
