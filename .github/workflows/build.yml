name: Build SimpleVoiceChatScroll

on:
  push:
    branches:
      - main
      - "fabric/**"
      - "forge/**"
      - "neoforge/**"
      - "ver/**"
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read Java version
        id: project
        shell: bash
        run: |
          java="$(sed -n 's/^java_version=//p' gradle.properties)"
          test -n "$java"
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.project.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon
